<!DOCTYPE html>
<html lang="en">
<head>
    <title>Absolute</title>
    <style>
        .parent{
            position: relative;
            width: 400px;
            height: 250px;
            background-color: lightgray;    
        }
        .child{
            position: absolute;
            top: 50px;
            right: 20px;
            width: 100px;
            height: 60px;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
     <div class="parent">parent box
    <div class="child">child box</div>
    </div>
</body>
</html>

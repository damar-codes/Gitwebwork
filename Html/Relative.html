<!DOCTYPE html>
<html lang="en">
<head>
    <title>Relative</title>
    <style>
        .box{
            width: 150px;
            height: 80px;
            background-color: lightblue;
            margin: 20px;
        }
        .box2{
            position: relative;
            top: 60px;
            left: 100;
            background-color: lightgreen;

        }
    </style>
</head>
<body>
    <div class="box">Box 1</div>
    <div class="box box2">Box 2</div>
    
</body>
</html>
